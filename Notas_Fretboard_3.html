<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --accent:#2563eb;

  --muted:#6b7280;
  --good:#16a34a;
  --bad:#dc2626;
}
body{
  margin:0;padding:24px;font-family:system-ui,sans-serif;
  background:var(--bg);color:var(--text);
}
.container{max-width:1100px;margin:auto}
.card{
  background:var(--card);border-radius:18px;padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{text-align:center}
.controls{
 display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0;
}
button{
 padding:10px 16px;border-radius:10px;border:1px solid #d1d5db;
 cursor:pointer;background:#fff;
}
button:hover{background:#f3f4f6}
.score{text-align:center;font-weight:700;margin:12px}
.feedback{text-align:center;font-weight:700;min-height:28px;margin:4px 0 12px}

.feedback.bad{color:var(--bad)}
svg{width:100%;height:auto;display:block}
.staff-line,.ledger{stroke:#111;stroke-width:1.3}
.note-head{fill:#111}
.section-title{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 4px;text-transform:uppercase;letter-spacing:.05em}

.fret-dot{transition:.15s}
.fret-dot:hover{stroke-width:2.5}
.fret-dot.disabled{cursor:default}
.fretboard-wrap{overflow-x:auto}

<script>
// ---------- Staff notes (natural notes only, C4-E5, all reachable on frets 0-12) ----------
// Each note: [name, y, frequency, ledgerLines[]]
const naturalIndex = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
function noteMidi(name){
  const letter = name[0];
  const octave = parseInt(name.slice(1), 10);
  return (octave + 1) * 12 + naturalIndex[letter];
}

const notes = [
  ["E3", 230, 164.81, [180, 200, 220]],
  ["F3", 220, 174.61, [180, 200, 220]],
  ["G3", 210, 196.00, [180, 200]],
  ["A3", 200, 220.00, [180, 200]],
  ["B3", 190, 246.94, [180]],
  ["C4", 180, 261.63, [180]],
  ["D4", 170, 293.66, []],
  ["E4", 160, 329.63, []],
  ["F4", 150, 349.23, []],
  ["G4", 140, 392.00, []],
  ["A4", 130, 440.00, []],
  ["B4", 120, 493.88, []],
  ["C5", 110, 523.25, []],
  ["D5", 100, 587.33, []],
  ["E5",  90, 659.25, []],
];

let current = null;
let score = 0;
let answered = false;

const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function drawNote(note) {
  const area = document.getElementById("noteArea");
  area.innerHTML = "";
  const [name, y, freq, ledgers] = note;
  const MIDDLE = 120; // B4, middle staff line

  ledgers.forEach(ly => {
    area.appendChild(svgEl("line", {
      x1: 470, x2: 530, y1: ly, y2: ly, class: "ledger"
    }));
  });

  const g = svgEl("g", { class: "note" });
  g.appendChild(svgEl("ellipse", {
    cx: 500, cy: y, rx: 11, ry: 8, class: "note-head"
  }));

  const stemUp = y >= MIDDLE;
  const stemX  = stemUp ? 511 : 489;
  const stemY1 = stemUp ? y - 4 : y + 4;
  const stemY2 = stemUp ? Math.min(y - 55, MIDDLE) : Math.max(y + 55, MIDDLE);
  g.appendChild(svgEl("line", {
    x1: stemX, x2: stemX, y1: stemY1, y2: stemY2,
    stroke: "#111", "stroke-width": "2"
  }));

  area.appendChild(g);
}

function playCurrent() {
  if (!current) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = current[2];
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.value = .1;
  osc.start();
  osc.stop(ctx.currentTime + 0.8);
}

// ---------- Fretboard ----------
// Standard tuning, string 0 = 1st string (high E) ... string 5 = 6th string (low E)
const stringNames = ["E", "B", "G", "D", "A", "E"];
const openMidi   = [64, 59, 55, 50, 45, 40];
const numFrets = 12;

const leftMargin = 70;
const topMargin = 40;
const fretSpacing = 62;
const stringSpacing = 32;
const fbWidth = leftMargin + numFrets * fretSpacing + 30;
const fbHeight = topMargin + 5 * stringSpacing + 30;

function drawFretboard() {
  const svg = document.getElementById("fretboardSvg");
  svg.setAttribute("viewBox", `0 0 ${fbWidth} ${fbHeight}`);
  svg.innerHTML = "";

  // "Open" / fret number labels
  const openLabel = svgEl("text", { x: leftMargin - 15, y: topMargin - 14, "font-size": 13, "text-anchor": "middle", fill: "#6b7280" });
  openLabel.textContent = "Open";
  svg.appendChild(openLabel);
  for (let f = 1; f <= numFrets; f++) {
    const x = leftMargin + (f - 0.5) * fretSpacing;
    const t = svgEl("text", { x, y: topMargin - 14, "font-size": 13, "text-anchor": "middle", fill: "#6b7280" });
    t.textContent = f;
    svg.appendChild(t);
  }

  // fret lines (vertical)
  for (let f = 0; f <= numFrets; f++) {
    const x = leftMargin + f * fretSpacing;
    svg.appendChild(svgEl("line", {
      x1: x, x2: x, y1: topMargin, y2: topMargin + 5 * stringSpacing,
      stroke: f === 0 ? "#111" : "#9ca3af", "stroke-width": f === 0 ? 4 : 2
    }));
  }

  // strings (horizontal)
  for (let s = 0; s < 6; s++) {
    const y = topMargin + s * stringSpacing;
    svg.appendChild(svgEl("line", {
      x1: leftMargin, x2: leftMargin + numFrets * fretSpacing, y1: y, y2: y,
      stroke: "#333", "stroke-width": 1.5
    }));
    const label = svgEl("text", { x: leftMargin - 40, y: y + 5, "font-size": 14, "font-weight": "700" });
    label.textContent = stringNames[s];
    svg.appendChild(label);
  }

  // fret markers (dots) at classic positions 3,5,7,9,12 - purely decorative
  [3, 5, 7, 9, 12].forEach(f => {
    const x = leftMargin + (f - 0.5) * fretSpacing;
    const y = topMargin + 5 * stringSpacing + 16;
    svg.appendChild(svgEl("circle", { cx: x, cy: y, r: 3, fill: "#d1d5db" }));
  });

  // clickable note positions
  for (let s = 0; s < 6; s++) {
    for (let f = 0; f <= numFrets; f++) {
      const x = f === 0 ? leftMargin - 16 : leftMargin + (f - 0.5) * fretSpacing;
      const y = topMargin + s * stringSpacing;
      const c = svgEl("circle", {
        cx: x, cy: y, r: 9, fill: "#fff", stroke: "#2563eb", "stroke-width": 1.5,
        class: "fret-dot"
      });
      c.dataset.string = s;
      c.dataset.fret = f;
      c.addEventListener("click", () => checkFret(s, f, c));
      svg.appendChild(c);
    }
  }
}

function resetFretboard() {
  answered = false;
  document.querySelectorAll(".fret-dot").forEach(dot => {
    dot.setAttribute("fill", "#fff");
    dot.classList.remove("disabled");
  });
}

function setFeedback(text, cls) {
  const el = document.getElementById("feedback");
  el.textContent = text;
  el.className = "feedback" + (cls ? " " + cls : "");
}

function isMatchingFret(s, f) {
  const pitchClass = (openMidi[s] + f) % 12;
  return pitchClass === naturalIndex[current.letter];
}

function checkFret(s, f, el) {
  if (!current || answered) return;
  if (isMatchingFret(s, f)) {
    answered = true;
    score++;
    document.getElementById("score").textContent = score;

    // Highlight every valid string/fret position for this note, not just the one clicked
    let matchCount = 0;
    document.querySelectorAll(".fret-dot").forEach(d => {
      d.classList.add("disabled");
      const ds = parseInt(d.dataset.string, 10);
      const df = parseInt(d.dataset.fret, 10);
      if (isMatchingFret(ds, df)) {
        d.setAttribute("fill", "#16a34a");
        matchCount++;
      }
    });

    const spotWord = matchCount === 1 ? "spot" : "spots";
    setFeedback(`Correct — that's ${current.name}! (${matchCount} valid ${spotWord} shown)`, "good");
    setTimeout(newQuestion, 5000);
  } else {
    el.setAttribute("fill", "#dc2626");
    setFeedback("Not quite — try another spot.", "bad");
    setTimeout(() => el.setAttribute("fill", "#fff"), 350);
  }
}

function showAnswer() {
  if (!current || answered) return;
  answered = true;

  let matchCount = 0;
  document.querySelectorAll(".fret-dot").forEach(d => {
    d.classList.add("disabled");
    const ds = parseInt(d.dataset.string, 10);
    const df = parseInt(d.dataset.fret, 10);
    if (isMatchingFret(ds, df)) {
      d.setAttribute("fill", "#f59e0b");
      matchCount++;
    }
  });

  const spotWord = matchCount === 1 ? "spot" : "spots";
  setFeedback(`That was ${current.name} — ${matchCount} valid ${spotWord} shown`, "");
  setTimeout(newQuestion, 5000);
}

function newQuestion() {
  const note = notes[Math.floor(Math.random() * notes.length)];
  current = { name: note[0], letter: note[0][0], midi: noteMidi(note[0]) };
  drawNote(note);
  resetFretboard();
  setFeedback("", "");
}

drawFretboard();
newQuestion();
</script>
